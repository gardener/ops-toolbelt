name: Validate release-notes from PRs
on:
  pull_request:
    types:
      - opened
      - edited
      - reopened

permissions:
  pull-requests: read

jobs:
  validate-release-notes:
    uses: gardener/cc-utils/.github/workflows/validate-release-notes.yaml@4f642e2dbcd2f01c7045e43682baac7f19417c9c # 1.2882.0
    permissions:
      pull-requests: read
    with:
      pull-request-body: ${{ github.event.pull_request.body }}
